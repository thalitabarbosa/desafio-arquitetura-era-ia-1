services:
  provider-fake:
    build: ./provider-fake
    env_file: .env
    ports:
      - "8090:8090"

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # Banco do gateway: chaves virtuais, orçamentos e gasto (ADR 0005).
  gateway-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # AI Gateway (ADR 0002): única peça que conhece providers, modelos físicos e credenciais.
  gateway:
    image: ghcr.io/berriai/litellm:v1.102.1
    entrypoint: ["sh", "/gateway/entrypoint.sh"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://litellm:${GATEWAY_DB_PASSWORD}@gateway-db:5432/litellm
    volumes:
      - ./gateway:/gateway:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "/gateway/healthcheck.py"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 20s
    depends_on:
      provider-fake:
        condition: service_healthy
      gateway-db:
        condition: service_healthy

  app:
    build: ./app
    # Piloto: as features ainda não migradas leem as chaves dos providers do .env.
    env_file: .env
    environment:
      GATEWAY_BASE_URL: http://gateway:4000/v1
      GATEWAY_API_KEY: ${HELPDESK_GATEWAY_KEY}
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      provider-fake:
        condition: service_healthy
      gateway:
        condition: service_healthy
